const cnt=k=>Object.values(S[k].g).reduce((n,g)=>n+g.length,0);
const DN=`<div class="c dn"><h2>☕ Quỹ donate cho admin</h2><p>Nếu web giúp ích cho bạn, ủng hộ admin một ly cà phê nhé!</p><p>Ngân hàng: <b>MB Bank</b></p><div class="stk" id="stk">0395814635</div><p>Chủ tài khoản: <b>TRAN NGUYEN HOANG</b></p><button id="cpb" onclick="cp()">📋 Sao chép số tài khoản</button></div>`;
function cp(){const t="0395814635",b=document.getElementById("cpb"),ok=()=>{b.textContent="✅ Đã sao chép";setTimeout(()=>b.textContent="📋 Sao chép số tài khoản",1800)};try{navigator.clipboard.writeText(t).then(ok,f)}catch(e){f()}function f(){const r=document.createRange();r.selectNodeContents(document.getElementById("stk"));const s=getSelection();s.removeAllRanges();s.addRange(r);try{document.execCommand("copy");ok()}catch(e){}}}
let sub,sel,Q,i,lock,tries=0;
const bk=()=>"best_"+sub,gb=()=>{try{return +localStorage.getItem(bk())||0}catch(e){return 0}},sb=n=>{try{if(n>gb())localStorage.setItem(bk(),n)}catch(e){}};
function home(){app.innerHTML=`<h1>📚 Ôn tập giữa kì 1</h1><p class="s">Làm đúng mới được qua câu tiếp – sai là làm lại từ đầu</p>`+Object.keys(S).map(k=>`<button class="c sj" onclick="setup('${k}')"><span>${S[k].ic}</span><b>${S[k].n}</b><small>${cnt(k)} câu</small></button>`).join("")+DN}
function setup(k){if(k){sub=k;sel=new Set(Object.keys(S[k].g))}const ks=Object.keys(S[sub].g);app.innerHTML=`<button class="back" onclick="home()">← Chọn môn</button><h1>${S[sub].ic} ${S[sub].n}</h1><div class="c"><b>Chọn phần muốn làm</b><div class="chips">${ks.map(g=>`<button class="chip ${sel.has(g)?"on":""}" onclick="tog('${g}')">${g} (${S[sub].g[g].length})</button>`).join("")}</div><div class="s" style="margin:0 0 12px">Kỷ lục: ${gb()} câu liên tiếp</div><button class="go" onclick="start()">Bắt đầu</button></div>`}
function tog(g){sel.has(g)?sel.size>1&&sel.delete(g):sel.add(g);setup()}
function start(){Q=sh(Object.keys(S[sub].g).filter(g=>sel.has(g)).flatMap(g=>S[sub].g[g]));i=0;lock=0;tries++;show()}
function show(){const q=Q[i];app.innerHTML=`<div class="top"><span>Câu ${i+1}/${Q.length}</span><span>Lần làm: ${tries} · Kỷ lục: ${gb()}</span></div><div class="bar"><i style="width:${i/Q.length*100}%"></i></div><div class="c"><p class="q">${esc(q.q)}</p>${q.o.map((o,j)=>`<button class="o" onclick="pick(${j})"><b>${"ABCD"[j]}.</b> ${esc(o)}</button>`).join("")}<div id="fb"></div></div>`}
function pick(j){if(lock)return;lock=1;const q=Q[i],b=document.querySelectorAll(".o");b[q.a].classList.add("ok");if(j==q.a){sb(i+1);setTimeout(()=>{if(i==Q.length-1)end();else{i++;lock=0;show()}},650)}else{b[j].classList.add("no");sb(i);document.getElementById("fb").innerHTML=`<div class="fb">❌ Sai rồi! Đáp án đúng: <b>${"ABCD"[q.a]}</b>. Bạn đã đúng ${i} câu liên tiếp.</div><button class="nx" onclick="start()">Làm lại từ đầu 🔁</button>`}}
function end(){app.innerHTML=`<div class="c" style="text-align:center"><h1>🎉 Hoàn thành!</h1><p>Đúng liên tiếp cả ${Q.length} câu sau ${tries} lần làm.</p><button class="nx" onclick="tries=0;start()">Làm lại (xáo trộn mới)</button><br><br><button class="chip" onclick="setup()">Chọn phần khác</button> <button class="chip" onclick="home()">Về trang chủ</button></div>`}
home();
</script></body></html>
