<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Bảo Trì Hệ Thống – Admin NGUYEN HOANG</title>
<style>
:root{
  --bg:#040711;
  --cyan:#38bdf8;
  --pink:#f43f5e;
  --purple:#8b5cf6;
  --emerald:#10b981;
  --txt:#f8fafc;
  --mut:#94a3b8;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);
  color:var(--txt);
  display:flex;
  align-items:center;
  justify-content:center;
  padding:18px;
  position:relative;
}

/* Nền lưới Cyberpunk & Cực quang */
.grid-bg{
  position:fixed;inset:0;z-index:0;pointer-events:none;
  background-image:
    linear-gradient(rgba(56,189,248,.06) 1px,transparent 1px),
    linear-gradient(90deg,rgba(56,189,248,.06) 1px,transparent 1px);
  background-size:36px 36px;
  mask-image:radial-gradient(circle at center,black 35%,transparent 85%);
  -webkit-mask-image:radial-gradient(circle at center,black 35%,transparent 85%);
}
.orb{
  position:fixed;border-radius:50%;filter:blur(95px);opacity:.45;z-index:0;pointer-events:none;
  animation:float 12s ease-in-out infinite alternate;
}
.orb.a{width:340px;height:340px;background:#0284c7;top:-80px;left:-60px}
.orb.b{width:360px;height:360px;background:#e11d48;bottom:-90px;right:-60px;animation-delay:-6s}
.orb.c{width:280px;height:280px;background:#7c3aed;top:40%;left:50%;transform:translate(-50%,-50%);opacity:.28}
@keyframes float{
  0%{transform:translate(0,0) scale(1)}
  100%{transform:translate(25px,-25px) scale(1.1)}
}

/* Thẻ kính trung tâm */
.card{
  position:relative;z-index:1;
  width:100%;max-width:480px;
  background:linear-gradient(160deg,rgba(30,41,59,.78) 0%,rgba(10,16,32,.92) 100%);
  border:1px solid rgba(148,163,184,.2);
  border-top-color:rgba(56,189,248,.45);
  border-bottom-color:rgba(244,63,94,.35);
  border-radius:26px;
  padding:32px 24px;
  text-align:center;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:
    0 25px 50px -12px rgba(0,0,0,.85),
    0 0 35px -10px rgba(56,189,248,.25),
    inset 0 1px 1px rgba(255,255,255,.15);
}

/* Vòng xoay lõi năng lượng */
.core-wrap{
  width:86px;height:86px;margin:0 auto 20px;position:relative;
  display:flex;align-items:center;justify-content:center;
}
.ring{
  position:absolute;inset:0;border-radius:50%;
  border:2.5px dashed rgba(56,189,248,.65);
  animation:spin 10s linear infinite;
}
.ring.inner{
  inset:10px;border-style:solid;border-color:transparent var(--pink) transparent var(--purple);
  animation:spinRev 4s linear infinite;
}
.core-ic{
  font-size:2.1rem;
  filter:drop-shadow(0 0 12px rgba(56,189,248,.6));
  animation:pulse 2s ease-in-out infinite;
}
@keyframes spin{100%{transform:rotate(360deg)}}
@keyframes spinRev{100%{transform:rotate(-360deg)}}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.1)}}

/* Nhãn trạng thái */
.badge{
  display:inline-flex;align-items:center;gap:8px;
  padding:5px 14px;border-radius:99px;
  background:rgba(244,63,94,.14);
  border:1px solid rgba(244,63,94,.45);
  color:#fda4af;font-size:.76rem;font-weight:800;letter-spacing:1px;
  margin-bottom:14px;
}
.dot{
  width:8px;height:8px;border-radius:50%;background:var(--pink);
  box-shadow:0 0 10px var(--pink);
  animation:blink 1.2s infinite;
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

/* Tiêu đề & Tên Admin */
h1{
  font-size:1.65rem;font-weight:900;letter-spacing:-.3px;margin-bottom:10px;
  background:linear-gradient(135deg,#ffffff 25%,#7dd3fc 70%,#f43f5e 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.desc{
  font-size:.96rem;color:#cbd5e1;line-height:1.55;margin-bottom:18px;
}
.admin-box{
  background:linear-gradient(90deg,rgba(14,165,233,.14),rgba(139,92,246,.18),rgba(244,63,94,.14));
  border:1px solid rgba(56,189,248,.35);
  border-radius:16px;
  padding:14px 16px;
  margin-bottom:20px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.12);
}
.admin-lbl{
  font-size:.74rem;text-transform:uppercase;letter-spacing:1.2px;color:#94a3b8;margin-bottom:4px;
}
.admin-name{
  font-size:1.22rem;font-weight:900;letter-spacing:1.2px;
  color:#38bdf8;
  text-shadow:0 0 16px rgba(56,189,248,.45);
}

/* Thanh tiến trình quét */
.progress-track{
  height:8px;background:rgba(6,10,20,.9);border-radius:99px;
  overflow:hidden;padding:1.5px;margin-bottom:10px;
  border:1px solid rgba(148,163,184,.16);
}
.progress-bar{
  height:100%;width:42%;border-radius:99px;
  background:linear-gradient(90deg,var(--cyan),var(--purple),var(--pink));
  box-shadow:0 0 12px rgba(56,189,248,.6);
  animation:scan 2.4s ease-in-out infinite alternate;
}
@keyframes scan{
  0%{transform:translateX(-15%);width:35%}
  100%{transform:translateX(155%);width:45%}
}

.log-txt{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
  font-size:.78rem;color:#7dd3fc;min-height:1.2em;margin-bottom:22px;opacity:.9;
}

/* Nút tải lại */
.btn{
  width:100%;padding:13px 18px;border:0;border-radius:14px;
  font-weight:700;font-size:.96rem;color:#fff;cursor:pointer;
  background:linear-gradient(135deg,#0284c7 0%,#6366f1 55%,#e11d48 100%);
  box-shadow:0 10px 24px -6px rgba(99,102,241,.5),inset 0 1px 1px rgba(255,255,255,.3);
  transition:transform .16s ease,filter .16s ease;
}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn:active{transform:translateY(1px)}
</style>
</head>
<body>
  <div class="grid-bg"></div>
  <div class="orb a"></div>
  <div class="orb b"></div>
  <div class="orb c"></div>

  <main class="card">
    <div class="core-wrap">
      <div class="ring"></div>
      <div class="ring inner"></div>
      <div class="core-ic">🛠️</div>
    </div>

    <div class="badge"><span class="dot"></span> SYSTEM MAINTENANCE</div>
    <h1>ĐANG BẢO TRÌ HỆ THỐNG</h1>
    <p class="desc">Trang web đang tạm đóng để nâng cấp dữ liệu và tính năng mới. Vui lòng quay lại sau ít phút!</p>

    <div class="admin-box">
      <div class="admin-lbl">Vui lòng đợi Admin</div>
      <div class="admin-name">NGUYEN HOANG UPDATE</div>
    </div>

    <div class="progress-track"><div class="progress-bar"></div></div>
    <div class="log-txt" id="log">&gt; Đang đồng bộ gói dữ liệu mới...</div>

    <button class="btn" id="reloadBtn" onclick="checkReload()">🔄 Kiểm tra & Tải lại trang</button>
  </main>

<script>
const logs = [
  "> Đang đồng bộ gói dữ liệu câu hỏi mới...",
  "> Đang tối ưu hóa máy chủ phòng Solo 1v1...",
  "> Đang cập nhật Bảng Xếp Hạng Real-time...",
  "> Admin NGUYEN HOANG đang hoàn tất bản cập nhật..."
];
let idx = 0;
setInterval(() => {
  idx = (idx + 1) % logs.length;
  const el = document.getElementById("log");
  if (el) el.textContent = logs[idx];
}, 2600);

function checkReload() {
  const btn = document.getElementById("reloadBtn");
  btn.textContent = "⏳ Đang kiểm tra trạng thái máy chủ...";
  setTimeout(() => location.reload(), 550);
}
</script>
</body>
</html>
